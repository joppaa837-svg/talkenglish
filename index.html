<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d4aff"><meta name="description" content="TalkEnglish — تعلم الإنجليزية بالمواقف والجمل والصوت والتحدث">
<link rel="manifest" href="manifest.json">
<title>TalkEnglish — اتكلم إنجليزي</title>
<style>
:root{--p:#6d4aff;--p2:#8c72ff;--bg:#f7f7fb;--card:#fff;--txt:#171728;--muted:#74748a;--ok:#18a56b;--warn:#ffb020;--danger:#ef5b67;--line:#ececf4;--shadow:0 10px 30px rgba(34,24,74,.08)}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt)}button,input{font:inherit}button{border:0;cursor:pointer}.app{max-width:900px;margin:auto;min-height:100vh;padding-bottom:82px}.top{position:sticky;top:0;z-index:5;background:rgba(247,247,251,.94);backdrop-filter:blur(12px);padding:14px 18px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;justify-content:space-between}.logo{font-weight:900;font-size:21px;color:var(--p)}.xp{background:#eeeafd;color:var(--p);padding:7px 11px;border-radius:999px;font-weight:800;font-size:13px}.view{padding:18px}.hero{background:linear-gradient(135deg,#6d4aff,#8d69ff);color:#fff;border-radius:28px;padding:24px;box-shadow:0 18px 40px rgba(109,74,255,.22);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.1);left:-50px;top:-70px}.hero h1{margin:0 0 8px;font-size:29px}.hero p{margin:0 0 18px;opacity:.92;line-height:1.7}.btn{padding:12px 17px;border-radius:14px;font-weight:800}.primary{background:#fff;color:var(--p)}.purple{background:var(--p);color:#fff}.soft{background:#f0edff;color:var(--p)}.dark{background:#20202e;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:15px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}.stat b{font-size:24px;display:block}.muted{color:var(--muted)}.section{margin-top:22px}.section h2{font-size:19px;margin:0 0 12px}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.chip{white-space:nowrap;padding:9px 13px;background:#fff;border:1px solid var(--line);border-radius:999px}.chip.active{background:var(--p);color:#fff;border-color:var(--p)}.lesson{display:flex;gap:13px;align-items:center}.icon{width:48px;height:48px;border-radius:15px;background:#f0edff;display:grid;place-items:center;font-size:23px;flex:none}.lesson h3{margin:0 0 4px;font-size:16px}.lesson p{margin:0;color:var(--muted);font-size:13px}.progress{height:9px;background:#eeeef5;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--p2));border-radius:inherit}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:8;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:flex;justify-content:center}.nav{max-width:900px;width:100%;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}.nav button{background:none;color:#88889a;font-size:11px;padding:5px}.nav button b{display:block;font-size:21px;margin-bottom:2px}.nav button.active{color:var(--p)}.back{display:flex;gap:10px;align-items:center;margin-bottom:16px}.back button{background:#fff;border:1px solid var(--line);border-radius:12px;width:42px;height:42px}.qbox{background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow)}.en{font-size:24px;font-weight:900;direction:ltr;text-align:left;line-height:1.35}.ar{font-size:17px;margin-top:9px}.pron{color:var(--p);font-size:15px;margin-top:7px}.audio{margin-top:15px}.round{width:48px;height:48px;border-radius:50%;background:var(--p);color:#fff;font-size:20px}.choices{display:grid;gap:10px;margin-top:16px}.choice{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;text-align:right}.choice.correct{border-color:var(--ok);background:#eaf9f2}.choice.wrong{border-color:var(--danger);background:#fff0f1}.feedback{margin-top:13px;padding:13px;border-radius:14px;background:#f7f5ff}.mic{width:78px;height:78px;border-radius:50%;background:var(--p);color:#fff;font-size:30px;display:block;margin:18px auto}.mic.listening{animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 14px rgba(109,74,255,.12)}}.center{text-align:center}.input{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}.tabs{display:flex;gap:8px;overflow:auto}.hidden{display:none!important}.badge{display:inline-flex;align-items:center;gap:6px;background:#fff5dc;color:#9a6500;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800}.list{display:grid;gap:10px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.small{font-size:12px}.modal{position:fixed;inset:0;background:rgba(10,10,25,.45);z-index:20;display:grid;place-items:end center}.sheet{background:#fff;width:min(900px,100%);border-radius:28px 28px 0 0;padding:22px;max-height:88vh;overflow:auto}.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#20202e;color:#fff;padding:11px 16px;border-radius:999px;z-index:30;font-size:13px}.level{font-weight:900;color:var(--p)}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.hero h1{font-size:34px}.view{padding:24px}}
</style></head>
<body><div class="app"><header class="top"><div class="brand"><div class="logo">TalkEnglish 🎙️</div><div class="xp" id="xpPill">0 XP</div></div></header><main id="app" class="view"></main><nav class="bottom"><div class="nav"><button data-nav="home"><b>⌂</b>الرئيسية</button><button data-nav="learn"><b>📚</b>تعلم</button><button data-nav="practice"><b>🎯</b>تدريب</button><button data-nav="progress"><b>📈</b>تقدمي</button><button data-nav="profile"><b>⚙️</b>حسابي</button></div></nav></div><div id="modal" class="modal hidden"></div><script>
const lessons=[
{id:1,level:'A1',icon:'👋',title:'التعارف والتحية',desc:'ابدأ أول محادثة بثقة',items:[['Hello!','مرحبًا!','هَلّو!'],['How are you?','كيف حالك؟','هاو آر يو؟'],['My name is Ahmed.','اسمي أحمد.','ماي نيم إز أحمد.'],['Nice to meet you.','سعيد بلقائك.','نايس تو ميت يو.'],['Where are you from?','من أين أنت؟','وير آر يو فرُم؟']]},
{id:2,level:'A1',icon:'🍔',title:'في المطعم',desc:'اطلب الأكل والمشروبات',items:[['Can I have a menu, please?','هل يمكنني الحصول على قائمة الطعام؟','كان آي هاف أ مِنو بليز؟'],['I would like a chicken sandwich.','أريد ساندويتش دجاج.','آي وُد لايك أ تشِكِن ساندويتش.'],['Can I have some water?','هل يمكنني الحصول على بعض الماء؟','كان آي هاف صَم ووتر؟'],['The bill, please.','الحساب من فضلك.','ذا بِل بليز.'],['It was delicious.','كان لذيذًا.','إت وُز دِلِشَس.']]},
{id:3,level:'A1',icon:'🛒',title:'التسوق',desc:'الأسعار والمقاسات والدفع',items:[['How much is this?','بكم هذا؟','هاو ماتش إز ذِس؟'],['Do you have a larger size?','هل لديكم مقاس أكبر؟','دو يو هاف أ لارجَر سايز؟'],['Can I try it on?','هل يمكنني تجربته؟','كان آي تراي إت أون؟'],['I will take it.','سآخذه.','آي وِل تيك إت.'],['Can I pay by card?','هل يمكنني الدفع بالبطاقة؟','كان آي باي باي كارد؟']]},
{id:4,level:'A2',icon:'✈️',title:'المطار والسفر',desc:'من تسجيل الوصول حتى بوابة الطائرة',items:[['Where is the check-in counter?','أين مكتب تسجيل الوصول؟','وير إز ذا تشِك-إن كاونتَر؟'],['I have a reservation.','لدي حجز.','آي هاف أ رِزَرفيشن.'],['Where is gate 12?','أين البوابة 12؟','وير إز غيت تويلف؟'],['What time does the flight leave?','متى تغادر الرحلة؟','وات تايم دَز ذا فلايت ليف؟'],['My luggage is missing.','أمتعتي مفقودة.','ماي لاجِج إز مِسِنج.']]},
{id:5,level:'A2',icon:'🏨',title:'الفندق',desc:'الحجز والغرفة والمشكلات',items:[['I have a booking under my name.','لدي حجز باسمي.','آي هاف أ بوكِنج أندر ماي نيم.'],['What time is check-out?','متى تسجيل المغادرة؟','وات تايم إز تشِك-آوت؟'],['Could I get another towel?','هل يمكنني الحصول على منشفة أخرى؟','كُد آي جِت أَنَذَر تاوِل؟'],['The air conditioner is not working.','مكيف الهواء لا يعمل.','ذي إير كَندِشنَر إز نوت وِركِنج.'],['Thank you for your help.','شكرًا لمساعدتك.','ثانك يو فور يور هِلب.']]},
{id:6,level:'A2',icon:'🚌',title:'المواصلات والاتجاهات',desc:'اسأل عن الطريق والتنقل',items:[['How can I get to the station?','كيف أصل إلى المحطة؟','هاو كان آي جِت تو ذا ستيشن؟'],['Is it far from here?','هل هو بعيد من هنا؟','إز إت فار فرُم هير؟'],['Turn left at the corner.','انعطف يسارًا عند الزاوية.','تِرن لِفت أت ذا كورنَر.'],['Go straight ahead.','اذهب مباشرة.','غو ستريت أَهِد.'],['How long does it take?','كم يستغرق الوقت؟','هاو لونج دَز إت تيك؟']]},
{id:7,level:'B1',icon:'💼',title:'الإنجليزية في العمل',desc:'اجتماعات ومكالمات ومهام',items:[['Could you send me the report?','هل يمكنك إرسال التقرير لي؟','كُد يو سِند مي ذا ريبورت؟'],['I agree with you.','أنا أتفق معك.','آي أَجري وِذ يو.'],['Let’s discuss this tomorrow.','دعنا نناقش هذا غدًا.','لِتس دِسكس ذِس تُمورو.'],['I will get back to you soon.','سأعود إليك قريبًا.','آي وِل جِت باك تو يو سون.'],['Could you clarify that point?','هل يمكنك توضيح هذه النقطة؟','كُد يو كلارِفاي ذات بوينت؟']]},
{id:8,level:'B1',icon:'📞',title:'المكالمات والمواعيد',desc:'تحدث بشكل طبيعي في الهاتف',items:[['May I speak to Mr. Ali?','هل يمكنني التحدث مع السيد علي؟','ماي آي سبيك تو مِستر علي؟'],['I’m calling about the appointment.','أتصل بخصوص الموعد.','آيم كولِنج أباوت ذي أَبوينتمِنت.'],['Could we reschedule?','هل يمكننا إعادة تحديد الموعد؟','كُد وي ريسكِجول؟'],['That works for me.','هذا مناسب لي.','ذات وِركس فور مي.'],['I’ll call you back later.','سأتصل بك لاحقًا.','آيل كول يو باك ليتر.']]},
{id:9,level:'B2',icon:'🗣️',title:'إبداء الرأي والنقاش',desc:'عبّر عن رأيك بطريقة طبيعية',items:[['In my opinion, this is a good idea.','في رأيي، هذه فكرة جيدة.','إن ماي أوبينيَن، ذِس إز أ جود آيديا.'],['I see your point, but I disagree.','أفهم وجهة نظرك، لكنني أختلف معك.','آي سي يور بوينت، بَت آي دِسَجري.'],['There are several factors to consider.','هناك عدة عوامل يجب أخذها في الاعتبار.','ذير آر سِفرَل فاكتورز تو كَنسِدَر.'],['That depends on the situation.','هذا يعتمد على الموقف.','ذات دِبِندز أون ذا سِتشُوايشن.'],['Let me explain what I mean.','دعني أوضح ما أعنيه.','لِت مي إكسبلين وات آي مين.']]},
{id:10,level:'C1',icon:'🎤',title:'العرض والتقديم',desc:'لغة احترافية للعرض والإقناع',items:[['Let me start by giving you some context.','دعوني أبدأ بإعطائكم بعض السياق.','لِت مي ستارت باي جِفِنج يو صَم كونتِكست.'],['The key point is that we need to act now.','النقطة الأساسية هي أننا بحاجة للتحرك الآن.','ذا كي بوينت إز ذات وي نيد تو آكت ناو.'],['I’d like to highlight three important issues.','أود تسليط الضوء على ثلاث نقاط مهمة.','آيد لايك تو هايلايت ثري إمبورتَنت إشووز.'],['Let’s move on to the next point.','لننتقل إلى النقطة التالية.','لِتس موف أون تو ذا نِكست بوينت.'],['Thank you for your attention.','شكرًا لاهتمامكم.','ثانك يو فور يور أتينشن.']]}];
const levels=['A1','A2','B1','B2','C1'];
const placement=[
['What is your name?','ما اسمك؟','وات إز يور نيم؟',['كيف اسمك؟','ما اسمك؟','أين اسمك؟'],'ما اسمك؟'],
['I ___ from Egypt.','أنا من مصر.','آي ___ فرُم إيجبت.',['am','is','are'],'am'],
['She ___ coffee every morning.','هي تشرب القهوة كل صباح.','شي ___ كوفي إفري مورنينج.',['drink','drinks','drinking'],'drinks'],
['Yesterday, I ___ to work.','أمس، ذهبت إلى العمل.','يسترداي، آي ___ تو وِرك.',['go','went','gone'],'went'],
['If I had more time, I ___ another language.','لو كان لدي وقت أكثر، لتعلمت لغة أخرى.','إف آي هاد مور تايم، آي ___ أنَذَر لانجْوِج.',['learn','would learn','learned'],'would learn'],
['The meeting was postponed ___ Monday.','تم تأجيل الاجتماع إلى يوم الاثنين.','ذا ميتِنج وُز بوستبوندِد ___ مَنداي.',['until','at','by'],'until']];
let state=JSON.parse(localStorage.getItem('talkenglish-final')||'null')||{xp:0,streak:1,completed:[],level:'A1',daily:0,answers:0,badges:[]};
const save=()=>{localStorage.setItem('talkenglish-final',JSON.stringify(state));document.getElementById('xpPill').textContent=state.xp+' XP'};
const app=document.getElementById('app');
function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1800)}
function speak(t){if(!('speechSynthesis'in window)){toast('الصوت غير متاح في المتصفح');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}
function addXP(n){state.xp+=n;state.daily++;if(state.xp>=100&&!state.badges.includes('first100'))state.badges.push('first100');save()}
function setNav(id){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===id))}
function home(){setNav('home');const done=state.completed.length;app.innerHTML=`<section class="hero"><h1>اتكلم إنجليزي بثقة 🚀</h1><p>تعلم بالجمل والمواقف والاستماع والتحدث — وكل جملة معها معناها بالعربي ونطقها بالعربي.</p><button class="btn primary" onclick="openLesson(${nextLesson().id})">ابدأ درس النهارده →</button></section><div class="grid"><div class="card stat"><span class="muted">المستوى</span><b class="level">${state.level}</b><small>يتغير بعد اختبار تحديد المستوى</small></div><div class="card stat"><span class="muted">السلسلة 🔥</span><b>${state.streak} يوم</b><small>استمر كل يوم</small></div><div class="card stat"><span class="muted">الدروس</span><b>${done}/${lessons.length}</b><small>مكتمل</small></div></div><div class="section"><h2>اختصارات سريعة</h2><div class="grid"><button class="card" onclick="placementTest()">🧭<br><b>اختبار تحديد المستوى</b><br><span class="muted small">اعرف تبدأ منين</span></button><button class="card" onclick="practice()">🎙️<br><b>تدريب التحدث</b><br><span class="muted small">اسمع وكرر</span></button><button class="card" onclick="review()">🧠<br><b>مراجعة ذكية</b><br><span class="muted small">راجع اللي اتعلمته</span></button><button class="card" onclick="game()">🎮<br><b>لعبة ترتيب الجملة</b><br><span class="muted small">تعلم والعب</span></button></div></div><div class="section"><h2>مواقف اليوم</h2><div class="list">${lessons.slice(0,4).map(l=>lessonCard(l)).join('')}</div></div>`;save()}
function nextLesson(){return lessons.find(l=>!state.completed.includes(l.id))||lessons[0]}
function lessonCard(l){const done=state.completed.includes(l.id);return `<button class="card lesson" onclick="openLesson(${l.id})"><span class="icon">${l.icon}</span><span style="flex:1;text-align:right"><h3>${l.title} ${done?'✓':''}</h3><p><b>${l.level}</b> · ${l.desc}</p></span><span>‹</span></button>`}
function learn(){setNav('learn');app.innerHTML=`<div class="row"><div><h1 style="margin:0">مكتبة الدروس 📚</h1><p class="muted">اختار المستوى والموقف.</p></div><button class="btn soft" onclick="placementTest()">اختبار المستوى</button></div><div class="chips" id="levelchips">${['ALL',...levels].map(x=>`<button class="chip ${x==='ALL'?'active':''}" onclick="filterLessons('${x}',this)">${x==='ALL'?'الكل':x}</button>`).join('')}</div><div id="lessonList" class="list" style="margin-top:14px">${lessons.map(lessonCard).join('')}</div>`}
function filterLessons(level,el){document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.getElementById('lessonList').innerHTML=lessons.filter(l=>level==='ALL'||l.level===level).map(lessonCard).join('')}
function openLesson(id){const l=lessons.find(x=>x.id===id);let i=0;function render(){const item=l.items[i];app.innerHTML=`<div class="back"><button onclick="learn()">→</button><div><b>${l.title}</b><div class="muted small">${l.level} · جملة ${i+1} من ${l.items.length}</div></div></div><div class="progress"><i style="width:${((i+1)/l.items.length)*100}%"></i></div><div class="qbox" style="margin-top:16px"><div class="en">${item[0]}</div><div class="ar">${item[1]}</div><div class="pron">🔊 النطق: ${item[2]}</div><div class="audio"><button class="round" onclick="speak(${JSON.stringify(item[0])})">▶</button> <span class="muted">اسمع الجملة</span></div></div><div class="grid" style="margin-top:14px"><button class="btn purple" onclick="startSpeak(${JSON.stringify(item[0])})">🎙️ اتكلم</button><button class="btn soft" onclick="speak(${JSON.stringify(item[0])})">🔊 اسمع تاني</button></div><div id="speakResult"></div><button class="btn dark" style="width:100%;margin-top:14px" onclick="${i<l.items.length-1?'next()':'finish()'}">${i<l.items.length-1?'الجملة التالية →':'إنهاء الدرس ✓'}</button>`}window.next=()=>{i++;render()};window.finish=()=>{if(!state.completed.includes(l.id)){state.completed.push(l.id);addXP(25);toast('+25 XP 🎉')}home()};render()}
function startSpeak(target){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){document.getElementById('speakResult').innerHTML='<div class="feedback">🎙️ التحدث من الميكروفون غير مدعوم في هذا المتصفح. جرّب Chrome على Android.</div>';return}const r=new SR();r.lang='en-US';r.interimResults=false;r.maxAlternatives=1;const btn=document.querySelector('.mic');r.onstart=()=>{if(btn)btn.classList.add('listening')};r.onend=()=>{if(btn)btn.classList.remove('listening')};r.onerror=()=>{document.getElementById('speakResult').innerHTML='<div class="feedback">لم أقدر أسمعك. تأكد من إذن الميكروفون وحاول مرة أخرى.</div>'};r.onresult=e=>{const got=e.results[0][0].transcript;const score=similarity(target,got);document.getElementById('speakResult').innerHTML=`<div class="feedback"><b>سمعتك:</b> <span dir="ltr">${got}</span><br><br><b>تطابق تقريبي: ${score}%</b><br><span class="muted small">ده تدريب تقريبي على النص، مش تقييم نطق احترافي للصوت نفسه.</span></div>`;if(score>=70)addXP(8)};document.getElementById('speakResult').innerHTML='<div class="center"><button class="mic listening">🎙️</button><p>اتكلم دلوقتي...</p></div>';r.start()}
function similarity(a,b){const A=a.toLowerCase().replace(/[^a-z ]/g,'').split(/\s+/),B=b.toLowerCase().replace(/[^a-z ]/g,'').split(/\s+/);let hits=0;A.forEach(w=>{if(B.includes(w))hits++});return Math.round(hits/Math.max(A.length,1)*100)}
function practice(){setNav('practice');const pool=lessons.flatMap(l=>l.items.map(x=>({...x,l})));const item=pool[Math.floor(Math.random()*pool.length)];app.innerHTML=`<div class="hero"><h1>تدريب التحدث 🎙️</h1><p>اسمع الجملة، وبعدها قولها بصوتك. التطبيق يحاول مقارنة الكلمات التي سمعها مع الجملة.</p><button class="btn primary" onclick="speak(${JSON.stringify(item[0])})">🔊 اسمع المثال</button></div><div class="qbox" style="margin-top:16px"><div class="en">${item[0]}</div><div class="ar">${item[1]}</div><div class="pron">النطق: ${item[2]}</div><div class="center"><button class="mic" onclick="startSpeak(${JSON.stringify(item[0])})">🎙️</button><b>اضغط واتكلم</b><p class="muted small">يفضل Chrome على Android لأن دعم SpeechRecognition يختلف بين المتصفحات.</p></div><button class="btn soft" style="width:100%" onclick="practice()">جملة جديدة ↻</button></div>`}
function review(){setNav('practice');const learned=lessons.flatMap(l=>l.items).filter((_,i)=>i<Math.max(5,state.completed.length*2+3));const item=learned[Math.floor(Math.random()*learned.length)];const answers=[item[1],...['مكان مختلف','ترجمة غير صحيحة','جملة أخرى'].sort(()=>Math.random()-.5)].slice(0,4);app.innerHTML=`<div class="back"><button onclick="home()">→</button><div><b>🧠 مراجعة ذكية</b><div class="muted small">ترجمة الجملة</div></div></div><div class="qbox"><div class="en">${item[0]}</div><div class="pron">النطق: ${item[2]}</div><div class="choices">${answers.map(a=>`<button class="choice" onclick="checkReview(this,${JSON.stringify(a)},${JSON.stringify(item[1])})">${a}</button>`).join('')}</div><div id="reviewMsg"></div><button class="btn soft" style="width:100%;margin-top:12px" onclick="speak(${JSON.stringify(item[0])})">🔊 اسمع</button></div>`}
function checkReview(el,a,correct){document.querySelectorAll('.choice').forEach(x=>x.disabled=true);if(a===correct){el.classList.add('correct');document.getElementById('reviewMsg').innerHTML='<div class="feedback">ممتاز! +10 XP ⭐</div>';addXP(10)}else{el.classList.add('wrong');document.getElementById('reviewMsg').innerHTML=`<div class="feedback">الإجابة الصحيحة: <b>${correct}</b></div>`}}
function game(){setNav('practice');const l=lessons[Math.floor(Math.random()*lessons.length)],item=l.items[Math.floor(Math.random()*l.items.length)];const words=item[0].replace(/[?.!,]/g,'').split(' ').sort(()=>Math.random()-.5);app.innerHTML=`<div class="back"><button onclick="home()">→</button><div><b>🎮 رتّب الجملة</b><div class="muted small">${item[1]}</div></div></div><div class="qbox"><div class="ar">كوّن الجملة الإنجليزية الصحيحة:</div><div id="sentence" class="card" style="margin-top:12px;min-height:60px;direction:ltr;text-align:left"></div><div id="words" class="chips" style="flex-wrap:wrap;margin-top:14px;direction:ltr">${words.map((w,i)=>`<button class="chip" onclick="pickWord(this,${JSON.stringify(w)})">${w}</button>`).join('')}</div><button class="btn purple" style="width:100%;margin-top:18px" onclick="checkGame(${JSON.stringify(item[0])})">تحقق ✓</button><div id="gameMsg"></div></div>`;window.picked=[]}
function pickWord(btn,w){btn.disabled=true;window.picked.push(w);document.getElementById('sentence').textContent=window.picked.join(' ')}
function checkGame(correct){const got=window.picked.join(' ');if(got.toLowerCase()===correct.replace(/[?.!,]/g,'').toLowerCase()){document.getElementById('gameMsg').innerHTML='<div class="feedback">صح! +15 XP 🎉</div>';addXP(15)}else document.getElementById('gameMsg').innerHTML='<div class="feedback">قريب! جرّب ترتيب الكلمات مرة تانية.</div>'}
function placementTest(){let i=0,score=0;function render(){const q=placement[i];app.innerHTML=`<div class="back"><button onclick="home()">→</button><div><b>🧭 اختبار تحديد المستوى</b><div class="muted small">سؤال ${i+1} من ${placement.length}</div></div></div><div class="progress"><i style="width:${((i+1)/placement.length)*100}%"></i></div><div class="qbox" style="margin-top:16px"><div class="en">${q[0]}</div><div class="ar">${q[1]}</div><div class="pron">${q[2]}</div><div class="choices">${q[3].map(a=>`<button class="choice" onclick="ans(${JSON.stringify(a)})">${a}</button>`).join('')}</div></div>`}window.ans=a=>{if(a===placement[i][4])score++;i++;if(i<placement.length)render();else{state.level=score<=1?'A1':score<=2?'A2':score<=3?'B1':score<=4?'B2':'C1';save();app.innerHTML=`<div class="hero"><h1>خلصنا الاختبار 🎉</h1><p>نتيجتك تساعدك تبدأ من مستوى مناسب. تقدر تغيّر المستوى من هنا في أي وقت.</p><div style="font-size:44px;font-weight:900">${state.level}</div><p>${score}/${placement.length} إجابات صحيحة</p><button class="btn primary" onclick="learn()">ابدأ دروس ${state.level}</button></div>`}};render()}
function progress(){setNav('progress');const pct=Math.round(state.completed.length/lessons.length*100);app.innerHTML=`<h1 style="margin-bottom:5px">تقدمي 📈</h1><p class="muted">كل خطوة محسوبة.</p><div class="card"><div class="row"><b>إكمال الدروس</b><b>${pct}%</b></div><div class="progress" style="margin-top:10px"><i style="width:${pct}%"></i></div></div><div class="grid"><div class="card stat"><span class="muted">XP</span><b>${state.xp}</b></div><div class="card stat"><span class="muted">أيام متتالية</span><b>🔥 ${state.streak}</b></div><div class="card stat"><span class="muted">جلسات اليوم</span><b>${state.daily}</b></div></div><div class="section"><h2>الإنجازات</h2><div class="grid">${state.badges.includes('first100')?'<div class="card"><span class="badge">🏆 أول 100 XP</span><p class="small muted">بدأت صح!</p></div>':'<div class="card"><span class="badge">🔒 100 XP</span><p class="small muted">اجمع 100 XP لفتحها</p></div>'}<div class="card"><span class="badge">🔥 سلسلة</span><p class="small muted">حافظ على التعلم يوميًا</p></div></div></div>`}
function profile(){setNav('profile');app.innerHTML=`<h1 style="margin-bottom:5px">حسابي ⚙️</h1><p class="muted">بياناتك محفوظة على هذا الجهاز.</p><div class="card"><div class="row"><div><b>مستواي</b><p class="muted small">${state.level}</p></div><button class="btn soft" onclick="placementTest()">اختبار جديد</button></div></div><div class="section list"><button class="card row" onclick="installHelp()"><span>📲 تثبيت التطبيق</span><span>‹</span></button><button class="card row" onclick="toast('الصوت يستخدم محرك الجهاز المتاح في المتصفح.')"><span>🔊 إعدادات الصوت</span><span>‹</span></button><button class="card row" onclick="resetData()"><span style="color:var(--danger)">🗑️ تصفير التقدم</span><span>‹</span></button></div><div class="section card"><b>ملاحظة عن التحدث</b><p class="muted small">التعرف على الكلام يعتمد على دعم المتصفح والجهاز. في بعض المتصفحات تتم معالجة التعرف عبر خدمة خارجية، لذلك لا نعتبره بديلًا عن تقييم نطق احترافي.</p></div>`}
function installHelp(){app.insertAdjacentHTML('beforeend',`<div class="card" style="margin-top:14px"><b>📲 على Android</b><p class="muted">من Chrome افتح القائمة ⋮ ثم اختر "إضافة إلى الشاشة الرئيسية" أو "Install app" إذا ظهرت.</p></div>`)}
function resetData(){if(confirm('متأكد إنك عايز تمسح كل التقدم؟')){localStorage.removeItem('talkenglish-final');location.reload()}}
function render(id='home'){({home,learn,practice,progress,profile}[id]||home)()}
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>render(b.dataset.nav));if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}render();
</script></body></html>
